name: Generate factory library (Neon)

on:
  workflow_dispatch:
    inputs:
      units:
        description: "Unit filter e.g. 1,2,9-20; empty = all"
        type: string
        required: false
        default: ""
      skip_refresh:
        description: "Skip refreshing existing content"
        type: boolean
        required: true
        default: true
      dry_run:
        description: "Perform a dry run without making changes"
        type: boolean
        required: true
        default: false
      author:
        description: "Author email"
        required: true
        default: "factory@monteverdi.app"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DJANGO_SETTINGS_MODULE: harmony.settings.common
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The repo ships a Pipfile, not requirements.txt (generate-neon-content.yml
        # still references requirements.txt and would fail on a clean checkout).
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --system --deploy

      - name: Verify database
        run: |
          python manage.py shell -c "from django.db import connection; c=connection.cursor(); c.execute('select 1'); print(c.fetchone())"

      - name: Migrate
        run: python manage.py migrate

      - name: Ensure factory account
        run: python manage.py ensure_factory_account --email "${{ inputs.author }}"

      - name: Import factory curated content
        run: python manage.py import_factory_curated --dir data/factory_curated --update

      - name: Generate factory library
        run: |
          CMD_ARGS=""
          if [ -n "${{ inputs.units }}" ]; then
            CMD_ARGS+=" --units ${{ inputs.units }}"
          fi
          if [ "${{ inputs.skip_refresh }}" = "true" ]; then
            CMD_ARGS+=" --skip-refresh"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD_ARGS+=" --dry-run"
          fi
          python manage.py generate_factory_library --author "${{ inputs.author }}" $CMD_ARGS
