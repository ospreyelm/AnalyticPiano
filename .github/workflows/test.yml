name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "Pipfile.lock"

      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --system --deploy
          pip install pytest

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: harmony.settings.ci
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: harmony.settings.ci
        run: pytest

      # pytest.ini testpaths only cover apps/exercises + scripts; the Django
      # runner covers the remaining apps with a proper isolated test DB.
      - name: Run Django-runner tests (student, teacher, dashboard, lab, accounts)
        env:
          DJANGO_SETTINGS_MODULE: harmony.settings.ci
        run: python manage.py test --noinput apps.student apps.teacher apps.dashboard apps.accounts lab

      - name: Factory library dry-check
        env:
          DJANGO_SETTINGS_MODULE: harmony.settings.ci
        run: |
          python manage.py generate_factory_library --dry-run
          python manage.py generate_factory_library --report
