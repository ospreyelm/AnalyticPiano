* { box-sizing: border-box; margin: 0; padding: 0; }

.branch-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.branch-btn {

  border-radius: 99px; border: 1.5px solid #ccc;
  cursor: pointer; background: #f5f5f5; color: #555; transition: all .15s;
}
@media (prefers-color-scheme: dark) { .branch-btn { background: #2a2a2a; color: #aaa; border-color: #444; } }
.branch-btn.active-core    { background:#E6F1FB; color:#0C447C; border-color:#378ADD; }
.branch-btn.active-a       { background:#EEEDFE; color:#3C3489; border-color:#7F77DD; }
.branch-btn.active-b       { background:#E1F5EE; color:#085041; border-color:#1D9E75; }

.branch-btn.active-d       { background:#FAEEDA; color:#633806; border-color:#BA7517; }

.branch-panel { display: none; }
.branch-panel.visible { display: block; }
.branch-desc { font-size: 12px; color: #666; margin-bottom: 4px; }
@media (prefers-color-scheme: dark) { .branch-desc { color: #999; } }
.branch-prereq { font-size: 11px; color: #888; margin-bottom: 14px; font-style: italic; }

.tier-header {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 8px;
  margin-bottom: 4px; cursor: pointer; user-select: none;
}
.tier-badge { font-size: 10px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.tier-title { font-size: 13px; font-weight: 500; }
.tier-toggle { margin-left: auto; font-size: 11px; }
.tier-desc { font-size: 11px; color: #777; margin: 0 0 8px 2px; }

.unit-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 18px; }
.unit-table th { text-align: left; padding: 5px 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #888; border-bottom: 1px solid #e5e5e5; }
@media (prefers-color-scheme: dark) { .unit-table th { color: #666; border-color: #333; } }
.unit-table td { padding: 6px 8px; vertical-align: top; border-bottom: 1px solid #f0f0f0; }
@media (prefers-color-scheme: dark) { .unit-table td { border-color: #2a2a2a; } }
.unit-table tr:last-child td { border-bottom: none; }
.unit-table tr:hover td { background: #f8f8f8; }
@media (prefers-color-scheme: dark) { .unit-table tr:hover td { background: #222; } }
.num { font-weight: 600; font-size: 11px; color: #999; }
.feat { color: #666; font-size: 11px; }
@media (prefers-color-scheme: dark) { .feat { color: #999; } }
.tag { font-family: monospace; font-size: 9px; padding: 1px 5px; border-radius: 3px;
  background: #f0f0f0; color: #666; display: inline-block; margin: 1px 2px 1px 0; }
@media (prefers-color-scheme: dark) { .tag { background: #2a2a2a; color: #888; } }

</style>

    ]
  },
  {
    id:"c", label:"Branch C — Interval Cycles & Slonimsky", hdrClass:"hdr-c", activeClass:"active-c",
    desc:"Post-tonal optional branch. Interval cycles, combination cycles, and Slonimsky's Thesaurus as compositional and analytical resource.",
    prereq:"Prereq: T4 Units 29–31 (PC sets, inversional symmetry). Extends into serialism and spectralism.",
    tiers:[
      { label:"IC-1 — Interval cycles", badge:"IC1", hdr:"hdr-c",
        desc:"Single-interval cycles: generating collections, symmetry, and cyclic pitch fields.",
        units:[
          {n:"C1", title:"Interval cycles 1–6",        feat:"IC1 (chromatic) through IC6 (tritone)",         tags:["interval_cycle_ic1","interval_cycle_ic2","interval_cycle_ic3","interval_cycle_ic6"]},
          {n:"C2", title:"Cyclic collections",         feat:"Whole-tone, octatonic, hexatonic as IC cycles",  tags:["cyclic_collection","ic_whole_tone","ic_octatonic"]},
          {n:"C3", title:"Transpositional symmetry",   feat:"T-symmetry, cyclic Tn invariance",              tags:["transpositional_symmetry","tn_invariance"]},
        ]
      },
      { label:"IC-2 — Combination cycles (Slonimsky)", badge:"IC2", hdr:"hdr-c",
        desc:"Slonimsky's Thesaurus: interpolation, ultrapolation, infrapolation; analytical applications.",
        units:[
          {n:"C4", title:"Slonimsky's Thesaurus overview",feat:"Organizing principles; the 1300+ patterns",  tags:["slonimsky_overview","thesaurus_organization"]},
          {n:"C5", title:"Interpolation",              feat:"Single/double/multiple interpolation patterns",  tags:["slonimsky_interpolation","combination_cycle_interp"]},
          {n:"C6", title:"Ultrapolation & infrapolation",feat:"Outer/inner extensions of cyclic patterns",   tags:["slonimsky_ultrapolation","slonimsky_infrapolation"]},
          {n:"C7", title:"Combination cycles in analysis",feat:"Messiaen modes, Ligeti, Coltrane changes",   tags:["combination_cycle_analysis","messiaen_modes","coltrane_changes_ic"]},
          {n:"C8", title:"Composition with IC/CC",     feat:"Writing etudes using interval & combo cycles",   tags:["ic_composition","slonimsky_etude"]},
        ]
      },
    ]
  },
  {
    id:"d", label:"Branch D — Neo-Riemannian Theory", hdrClass:"hdr-d", activeClass:"active-d",
    desc:"Triadic transformations, Tonnetz, and voice-leading geometry. Can follow Tier 3 or run parallel to Tier 4. Strong connection to late Romantic repertoire and triadic post-tonalism.",
    prereq:"Prereq: Tier 2 complete. Pairs well with Tier 3 chromaticism and T4 PC-set work.",
    tiers:[
      { label:"NR-1 — Transformations & Tonnetz", badge:"NR1", hdr:"hdr-d",
        desc:"PLR operations, Tonnetz lattice, hexatonic cycles.",
        units:[
          {n:"D1", title:"P, L, R transformations",   feat:"Parallel, Leading-tone, Relative operations",     tags:["plr_parallel","plr_leadingtone","plr_relative"]},
          {n:"D2", title:"The Tonnetz",               feat:"Toroidal pitch space, lattice navigation",         tags:["tonnetz","tonnetz_navigation","tonnetz_torus"]},
          {n:"D3", title:"Compound transformations",  feat:"PL, PR, LR, PLPR chains; Cohn's cycles",          tags:["plr_compound","cohn_cycles","hexatonic_cycle"]},

        desc:"Analytical application and geometric voice-leading spaces.",

const nav = document.getElementById('nav');
const panels = document.getElementById('panels');

branches.forEach((branch, bi) => {
  const btn = document.createElement('button');
  btn.className = 'branch-btn' + (bi===0 ? ' ' + branch.activeClass : '');
  btn.id = 'btn-' + branch.id;
  btn.textContent = branch.label;
  btn.onclick = () => switchBranch(branch.id, branch.activeClass);
  nav.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'branch-panel' + (bi===0 ? ' visible' : '');
  panel.id = 'panel-' + branch.id;

  let html = `<p class="branch-desc">${branch.desc}</p>`;
  if (branch.prereq) html += `<p class="branch-prereq">${branch.prereq}</p>`;

  branch.tiers.forEach((tier, ti) => {
    const tid = branch.id + '_t' + ti;
    html += `
    <div class="tier-header ${tier.hdr}" onclick="toggleTier('${tid}')">
      <span class="tier-badge">${tier.badge}</span>
      <span class="tier-title">${tier.label}</span>
      <span class="tier-toggle" id="tog-${tid}">▾</span>
    </div>
    <p class="tier-desc" id="desc-${tid}">${tier.desc}</p>
    <div id="body-${tid}">
    <table class="unit-table">
      <thead><tr>
        <th style="width:44px">#</th>
        <th style="width:190px">Unit title</th>
        <th style="width:210px">Key features</th>
        <th>Tags (slug format)</th>
      </tr></thead>
      <tbody>
      ${tier.units.map(u=>`<tr>
        <td><span class="num">${u.n}</span></td>
        <td>${u.title}</td>
        <td class="feat">${u.feat}</td>
        <td>${u.tags.map(t=>`<span class="tag">unit:${u.n}_${t}</span>`).join('')}</td>
      </tr>`).join('')}
      </tbody>
    </table>
    </div>`;
  });

  panel.innerHTML = html;
  panels.appendChild(panel);
});

const collapsed = {};
function toggleTier(id) {
  collapsed[id] = !collapsed[id];
  document.getElementById('body-' + id).style.display = collapsed[id] ? 'none' : '';
  document.getElementById('desc-' + id).style.display = collapsed[id] ? 'none' : '';
  document.getElementById('tog-' + id).textContent = collapsed[id] ? '▸' : '▾';
}

let currentActive = 'active-core';
function switchBranch(id, activeClass) {
  document.querySelectorAll('.branch-panel').forEach(p => p.classList.remove('visible'));
  document.querySelectorAll('.branch-btn').forEach(b => {
    branches.forEach(br => b.classList.remove(br.activeClass));
  });
  document.getElementById('panel-' + id).classList.add('visible');
  document.getElementById('btn-' + id).classList.add(activeClass);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
