{# apps/student/templates/student/base.html #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Monteverdi{% endblock %}</title>
  {% load static %}
  <link href="{% static 'student/student.css' %}" rel="stylesheet">
</head>
<body>
  <header class="s-header">
    <a class="s-header-brand" href="{% url 'student:home' %}">Monteverdi</a>
    {% if request.user.is_authenticated %}
      <form class="s-header-auth" method="post" action="{% url 'student:logout' %}">
        {% csrf_token %}
        <span class="s-header-user">{{ request.user.first_name|default:request.user.email }}</span>
        <button class="s-header-signout" type="submit">Sign out</button>
      </form>
    {% endif %}
  </header>
  <main class="s-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
