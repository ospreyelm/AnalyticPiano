<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarmonyLab — Connection Error</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      max-width: 32rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.75rem 0;
      color: #0f172a;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.55;
      color: #475569;
      margin: 0 0 0.75rem 0;
    }
    p:last-child { margin-bottom: 0; }
    code {
      background: #f1f5f9;
      border-radius: 4px;
      padding: 0.1rem 0.35rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Couldn't verify this connection</h1>
    <p>
      HarmonyLab could not validate this launch request from your
      institution's LMS.
    </p>
    <p>If this persists, contact your LMS administrator: <code>{{ message }}</code></p>
  </div>
</body>
</html>
