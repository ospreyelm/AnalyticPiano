<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harmonization Review</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #172033; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { border: 1px solid #d8dee9; padding: 8px 10px; text-align: left; }
    th { background: #f5f7fb; }
  </style>
</head>
<body>
  <h1>Figure Parser Review</h1>
  <p>Review whether bass+figure inputs expand to the notes a musician expects.</p>
  <table>
    <thead><tr><th>Key</th><th>Input</th><th>Expanded</th><th>Notes</th><th>Pitch classes</th></tr></thead>
    <tbody>
<tr><td>C</td><td>C + 6</td><td>6/3</td><td>A, E</td><td>9, 4</td></tr>
<tr><td>C</td><td>F + 6</td><td>6/3</td><td>D, A</td><td>2, 9</td></tr>
<tr><td>C</td><td>F + #</td><td>#3/5</td><td>A#, C</td><td>10, 0</td></tr>
<tr><td>C</td><td>G + 7</td><td>7/5/3</td><td>F, D, B</td><td>5, 2, 11</td></tr>
<tr><td>G</td><td>F# + 6/5</td><td>6/5/3</td><td>D, C, A</td><td>2, 0, 9</td></tr>
<tr><td>C</td><td>C + 9/7/5/3</td><td>9/7/5/3</td><td>D, B, G, E</td><td>2, 11, 7, 4</td></tr>
    </tbody>
  </table>
</body>
