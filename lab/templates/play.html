{% extends "__base.html" %}

{% block js_extra %}
<script>require(['app/main']);</script>
{% endblock %}

{% block content %}
<div id="container" class="js-fade-in fade" style="opacity: 0;">
	{% include "_header_music.html" %}
	{% include "_menu_music.html" %}
	{% include "_menu_piano.html" %}
	{% include "_notifications.html" %}
	<div class="harmony-ui">
		<div id="staff-area" class="content-area">
			<div id="staff-toolbar">
				<a class="icon-btn icon-btn-right icon-btn-camera js-btn-screenshot" href="#" target="_blank" title="Screenshot &ndash; works in some browsers" alt="Screenshot"> </a>
				<a class="save-icon js-btn-upload-json" title="Create exercise" alt="Upload JSON"> </a>
				<div id="save-feedback" class="feedback-inline" aria-live="polite"></div>
				<!-- <a class="download-icon js-btn-download-json" alt="Download JSON"> </a> -->
				<a class="refresh-icon js-btn-pristine" title="Reload sheet music" alt="Reload sheet music"> </a>
				<label for="play-meter-select" style="font-size:12px;margin-left:10px;vertical-align:middle;">Meter:</label>
				<select id="play-meter-select" title="Set meter (auto-suggests barlines)" style="font-size:12px;padding:2px 4px;vertical-align:middle;border:1px solid #bbb;border-radius:3px;">
					<option value="">Free</option>
					<option value="2/4">2/4</option>
					<option value="3/4">3/4</option>
					<option value="4/4">4/4</option>
					<option value="6/8">6/8</option>
				</select>
				<label for="play-analysis-above" style="font-size:12px;margin-left:10px;vertical-align:middle;">Above:</label>
				<select id="play-analysis-above" title="Analysis above the staff" style="font-size:12px;padding:2px 4px;vertical-align:middle;border:1px solid #bbb;border-radius:3px;">
					<option value="">None</option>
					<option value="note_names">Note names</option>
				</select>
				<label for="play-analysis-below" style="font-size:12px;margin-left:10px;vertical-align:middle;">Below:</label>
				<select id="play-analysis-below" title="Analysis below the staff" style="font-size:12px;padding:2px 4px;vertical-align:middle;border:1px solid #bbb;border-radius:3px;">
					<option value="">None</option>
					<option value="roman_numerals">Roman numerals</option>
					<option value="thoroughbass">Figured bass</option>
				</select>
			</div>
			<div id="staffwrapper">
				<div id="user-interaction-solicitation">CLICK TO START AUDIO</div>
				<canvas id="staff"></canvas>
			</div>
		</div>
		<div id="piano"></div>
	</div>
    {% include "_footer.html" %}
</div>
<div style="font-family: 'Sebastian'">&nbsp;<!-- make sure font is loaded  --></div>
<div style="font-family: 'MainSerifs'">&nbsp;<!-- make sure font is loaded  --></div>
<div style="font-family: 'JazzSerifs'">&nbsp;<!-- make sure font is loaded  --></div>
{% endblock %}
