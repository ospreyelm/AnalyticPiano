{% extends 'dashboard/base-content-list.html' %}

{% block content %}
<div class="dashboard-page">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h1>{{ course_title }}</h1>
        <a href="{% url 'lab:skill-map' course_id %}" class="btn btn-outline-primary" style="font-weight: bold; border-radius: 20px; padding: 5px 20px;">
            <i class="ion-map"></i> Visualize Progress
        </a>
    </div>
    {% if course_author %}
        <p>By {{ course_author }}</p>
    {% endif %}
    {% include 'django_tables2/bootstrap4.html' with table=playlists_table %}
</div>
{% endblock %}
