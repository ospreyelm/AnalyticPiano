<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    {% load static django_vite %}
    {% vite_hmr_client %}
    <link href="{% static 'css/ionicons-needed.css' %}" type="text/css" rel="stylesheet" />
    <link href="{% static 'css/harmony.css' %}" type="text/css" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'site.webmanifest' %}">
    {% block css_extra %}{% endblock %}
</head>
<body>

{% block content %}{% endblock %}

{% block js_require %}
{% autoescape off %}
<script>
  window.appConfig = {{ requirejs.config_json }};
  window.appStaticUrl = '{% static '' %}';
  window.require = function () {};
</script>
{% endautoescape %}
{% vite_asset 'lab/static/js/src/main.js' %}
{% endblock %}

{% block js_extra %}{% endblock %}

</body>
</html>
